services:
  browser:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.browser
    volumes:
      - chrome_profile:/data/chrome-profile
    ports:
      - "6080:6080"
      - "9222:9223"
      - "3001:3001"
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9223/json/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  collect:
    platform: linux/amd64
    build: .
    network_mode: "service:browser"
    env_file:
      - .env.local
    depends_on:
      browser:
        condition: service_healthy
    environment:
      - BROWSER_MODE=cdp
      - TIKTOK_CDP_URL=http://localhost:9222
      - OUTPUT_DIR=/app/output
      - COLLECT_INTERVAL_MS=600000
      - DAEMON_PORT=3000
      - AUTO_START_LOOP=true
      - MAX_FOLLOWERS=10000
      - ACTIVE_HOURS_START=18
      - ACTIVE_HOURS_END=3
      - COLLECT_TIMEOUT_MS=600000
      - BROWSER_CONTROL_URL=http://localhost:3002
      - MAX_BROWSER_ERROR_STREAK=1
      - BROWSER_RESTART_SETTLE_MS=10000
      - LIVE_MEDIA_WAIT_MS=10000
    volumes:
      - ./src:/app/src:ro
      - ./output:/app/output
      - ./playwright/.auth:/app/playwright/.auth
    command: node src/collect-daemon.js
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    env_file:
      - .env.local
    ports:
      - "5678:5678"
    networks:
      - app-net
    environment:
      - N8N_RESTRICT_ENVIRONMENT_VARIABLES_ACCESS=false
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./output:/home/node/.n8n-files/output:ro
    restart: unless-stopped

networks:
  app-net:
    driver: bridge

volumes:
  chrome_profile:
  n8n_data:
